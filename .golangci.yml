version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod
  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:
    - modernize
    - govet
    - errorlint
    - misspell
    - nilerr
    - nilnesserr
    - nolintlint
    - unparam
    - unconvert
    - wastedassign
    - whitespace
    - dupl
    - gocognit
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 150
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - dupl
          - gocognit
          - nilnil
      # Stat_t.Nlink is uint16 on Darwin and uint64 on linux/amd64. Keep the
      # explicit cross-platform normalization while suppressing Linux's
      # target-specific unconvert false positive only at that assignment.
      - path: packages/storage/local/target_metadata_unix\.go
        source: 'linkCount: uint64\(stat\.Nlink\),'
        linters:
          - unconvert
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
