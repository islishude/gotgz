version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod
  build-tags:
    - e2e
    - integration

linters:
  default: standard
  enable:
    - modernize
    - govet
    - errorlint
    - misspell
    - nilerr
    - nilnesserr
    - nolintlint
    - unparam
    - unconvert
    - wastedassign
    - whitespace
    - dupl
    - gocognit
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 150
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - dupl
          - gocognit
          - nilnil
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
