name: test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ruststack:
        image: ghcr.io/tyrchen/rustack:0.9.1
        env:
          DEFAULT_REGION: us-east-1
          SERVICES: s3
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true
      - run: go build ./...
      - run: gofmt -d .
      - run: go mod tidy -diff
      - run: go test -v -race -count=1 -coverprofile=coverage.txt -covermode=atomic -tags "integration e2e" ./...
        env:
          DEFAULT_REGION: us-east-1
          GOTGZ_TEST_S3_ENDPOINT: "http://localhost:4566"
      - run: go tool cover -func=coverage.txt
